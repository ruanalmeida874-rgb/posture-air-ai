<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mintViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#34d399" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#0c0d12" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  
  <!-- Outer Activity Ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="4" />
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#mintViolet)" stroke-width="4" stroke-dasharray="105 132" stroke-linecap="round" transform="rotate(-90 32 32)" filter="url(#glow)" />
  
  <!-- Central Upright Cervical / Spinal Alignment Spark -->
  <circle cx="32" cy="22" r="3" fill="#34d399" />
  <path d="M32 27 L32 40" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="42" r="2" fill="#818cf8" />
</svg>
